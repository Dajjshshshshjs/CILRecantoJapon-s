<script>
const WORDS=[
 {jp:'あ',roma:'a',pt:'a',hint:'Vogal aberta, como o “a” de casa.'},
 {jp:'い',roma:'i',pt:'i',hint:'Vogal curta, como em “ilha”.'},
 {jp:'う',roma:'u',pt:'u',hint:'Som de “u”, com os lábios pouco arredondados.'},
 {jp:'え',roma:'e',pt:'e',hint:'Vogal como o “e” de “mesa”.'},
 {jp:'お',roma:'o',pt:'o',hint:'Vogal como o “o” de “ovo”.'},
 {jp:'か',roma:'ka',pt:'ka',hint:'Combine o か com a vogal “a”.'},
 {jp:'き',roma:'ki',pt:'ki',hint:'O traço curvo fica no lado esquerdo.'},
 {jp:'さ',roma:'sa',pt:'sa',hint:'Lembre-se do “s” de sapo.'},
 {jp:'た',roma:'ta',pt:'ta',hint:'Começa com o som de “t”.'},
 {jp:'な',roma:'na',pt:'na',hint:'Começa com o som de “n”.'},
 {jp:'ねこ',roma:'neko',pt:'gato',hint:'Um animal de estimação muito comum.'},
 {jp:'いぬ',roma:'inu',pt:'cachorro',hint:'Outro animal de estimação.'},
 {jp:'みず',roma:'mizu',pt:'água',hint:'Você bebe todos os dias.'},
 {jp:'ほん',roma:'hon',pt:'livro',hint:'Tem páginas e histórias.'},
 {jp:'やま',roma:'yama',pt:'montanha',hint:'É alta e fica na natureza.'}
];

let user=null, isLogin=false, game=null, timer=null;

async function api(url, options={}) {
  const response=await fetch(url,{
    ...options,
    headers:{
      'Content-Type':'application/json',
      ...(options.headers||{})
    }
  });

  const payload=await response.json();

  if(!response.ok)
    throw new Error(payload.error||'Não foi possível concluir a solicitação.');

  return payload;
}

window.onload=async()=>{
  try {
    const {user: sessionUser}=await api('/api/auth/session');
    user=sessionUser;
    openApp();
  } catch {
    /* sem sessão ativa */
  }
};

function toggleAuth(){
  isLogin=!isLogin;

  document.getElementById('nameGroup').classList.toggle('hidden',isLogin);
  document.getElementById('schoolFields').classList.toggle('hidden',isLogin);

  document.getElementById('authTitle').textContent=
    isLogin?'Que bom ver você!':'Vamos começar?';

  document.getElementById('authText').textContent=
    isLogin
      ?'Use seu e-mail e senha para continuar seu progresso.'
      :'Crie sua conta para salvar seu progresso com segurança.';

  document.getElementById('authButton').textContent=
    isLogin?'Entrar →':'Criar conta →';

  document.getElementById('authToggle').textContent=
    isLogin?'Ainda não tenho uma conta':'Já tenho uma conta';

  document.getElementById('password').autocomplete=
    isLogin?'current-password':'new-password';
}

/*
 * FOTO OPCIONAL
 *
 * Se o usuário não escolher uma foto:
 * retorna uma string vazia e o cadastro continua.
 *
 * Se escolher uma foto:
 * transforma a imagem em Data URL normalmente.
 */
function photoData(file){
  return new Promise((resolve,reject)=>{
    if(!file){
      return resolve('');
    }

    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result);
    };

    reader.onerror=()=>{
      reject(new Error('Não foi possível ler a foto.'));
    };

    reader.readAsDataURL(file);
  });
}

async function enterApp(){
  const email=document.getElementById('email').value.trim();
  const name=document.getElementById('name').value.trim();
  const password=document.getElementById('password').value;
  const err=document.getElementById('authError');
  const button=document.getElementById('authButton');

  if(!email||!password||(!isLogin&&!name)){
    err.textContent='Preencha todos os campos para continuar.';
    err.classList.remove('hidden');
    return;
  }

  button.disabled=true;
  button.textContent='Aguarde…';

  try {
    const endpoint=isLogin
      ?'/api/auth/login'
      :'/api/auth/signup';

    const body=isLogin
      ?{
          email,
          password
        }
      :{
          name,
          email,
          password,
          semester:Number(document.getElementById('semester').value),
          classroom:document.getElementById('classroom').value.trim(),
          profilePhoto:await photoData(
            document.getElementById('profilePhoto').files[0]
          )
        };

    const result=await api(endpoint,{
      method:'POST',
      body:JSON.stringify(body)
    });

    user=result.user;
    err.classList.add('hidden');
    openApp();

  } catch(error) {
    err.textContent=error.message;
    err.classList.remove('hidden');

  } finally {
    button.disabled=false;
    button.textContent=isLogin?'Entrar →':'Criar conta →';
  }
}

async function save(){
  if(!user)return;

  try {
    const {user:saved}=await api('/api/me/progress',{
      method:'PATCH',
      body:JSON.stringify({
        correct:user.correct,
        total:user.total,
        errors:user.errors,
        streak:user.streak,
        lastDay:user.lastDay
      })
    });

    user=saved;

  } catch(error) {
    console.error('Não foi possível salvar o progresso.',error);
  }
}

function openApp(){
  document.getElementById('authScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');

  document.getElementById('sideName').textContent=user.name;

  document.getElementById('adminNav').classList.toggle(
    'hidden',
    user.role!=='admin'
  );

  if(user.approvalStatus==='pending'){
    setHeader(
      'Cadastro em análise',
      'Aguarde a aprovação da administração para acessar as aulas.'
    );

    document.getElementById('view').innerHTML=
      '<div class="empty">Seu cadastro foi enviado. Assim que for aprovado, as aulas e materiais serão liberados.</div>';

    return;
  }

  document.getElementById('pageTitle').textContent=
    `Olá, ${user.name.split(' ')[0]}!`;

  touchStreak();
  showDashboard();
}

function touchStreak(){
  let today=new Date().toDateString();

  if(user.lastDay!==today){
    user.streak++;
    user.lastDay=today;
    void save();
  }

  document.getElementById('streak').textContent=user.streak;
}

async function logout(){
  try {
    await api('/api/auth/logout',{method:'POST'});
  } catch(error) {
    console.error(error);
  }

  user=null;

  document.getElementById('app').classList.add('hidden');
  document.getElementById('authScreen').classList.remove('hidden');
  document.getElementById('password').value='';
}

function navActive(i=0){
  document.querySelectorAll('.nav button').forEach(
    (b,n)=>b.classList.toggle('active',n===i)
  );
}

async function adminAction(id,action){
  let body={};

  if(action==='reject'){
    const justification=prompt(
      'Justificativa obrigatória para reprovar/recusar:'
    );

    if(!justification)return;

    body={justification};
  }

  if(action==='semester'){
    const semester=Number(
      prompt('Novo semestre (1 a 12):')
    );

    if(!semester)return;

    body={semester};
  }

  try{
    await api(
      '/api/admin/students/'+id+'/'+action,
      {
        method:'POST',
        body:JSON.stringify(body)
      }
    );

    showAdmin();

  }catch(error){
    alert(error.message);
  }
}

function startGame(type,difficulty){
  clearInterval(timer);

  navActive(type==='review'?3:2);

  let pool=
    type==='review'&&user.errors.length
      ?user.errors.map(i=>WORDS[i])
      :WORDS;

  game={
    type,
    difficulty,
    index:0,
    score:0,
    items:[...pool]
      .sort(()=>Math.random()-.5)
      .slice(0,Math.min(10,pool.length)),
    seconds:type==='quick'?45:null,
    answered:false
  };

  setHeader(
    type==='quick'
      ?'Contra o tempo'
      :type==='choice'
        ?'Múltipla escolha'
        :type==='review'
          ?'Revisão inteligente'
          :'Prática de hiragana',

    difficulty==='easy'
      ?'Com áudio, leitura e tradução.'
      :difficulty==='medium'
        ?'Use as dicas quando precisar.'
        :'Só o japonês. Boa sorte!'
  );

  renderQuestion();

  if(type==='quick'){
    timer=setInterval(()=>{
      game.seconds--;

      let t=document.getElementById('timer');

      if(t)
        t.textContent=game.seconds+'s';

      if(game.seconds<=0)
        finishGame();

    },1000);
  }
}

function renderQuestion(){
  let w=game.items[game.index];

  if(!w)
    return finishGame();

  let easy=game.difficulty==='easy';
  let medium=game.difficulty==='medium';
  let showHelp=easy||medium;

  let content=`
    <div class="learn-wrap">

      <div class="game-meta">
        <button class="back"
          onclick="showDashboard()">
          ← Voltar ao início
        </button>

        <span>
          ${game.index+1} de ${game.items.length}

          ${
            game.type==='quick'
              ?' · <b class="timer" id="timer">'+game.seconds+'s</b>'
              :''
          }
        </span>
      </div>

      <section class="panel game-panel">

        <span class="badge">
          ${game.type==='choice'
            ?'Escolha a leitura'
            :'Qual é a leitura?'}
        </span>

        <div class="word">${w.jp}</div>

        ${
          easy
            ?`
              <div class="word-meaning">
                Significa: <b>${w.pt}</b>
              </div>

              <button class="audio-btn"
                onclick="speak('${w.roma}')">
                🔊 Ouvir a pronúncia
              </button>
            `
            :''
        }

        ${
          medium
            ?`
              <button class="audio-btn"
                onclick="document.getElementById('hint').classList.toggle('hidden')">
                💡 Ver dica
              </button>

              <div id="hint"
                class="hint-box hidden">
                ${w.hint}
              </div>
            `
            :''
        }

        ${
          game.type==='choice'
            ?`
              <div class="choices">
                ${choices(w).map(x=>`
                  <button class="choice"
                    onclick="answer('${x.replace(/'/g,"\\'")}')">
                    ${x}
                  </button>
                `).join('')}
              </div>
            `
            :`
              <div class="answer-row">
                <input id="answer"
                  autocomplete="off"
                  placeholder="Digite em letras romanas (ex.: ka)"
                  onkeydown="if(event.key==='Enter')answer()">

                <button class="btn"
                  onclick="answer()">
                  Responder
                </button>
              </div>
            `
        }

        <p id="feedback"
          class="feedback">
        </p>

      </section>
    </div>
  `;

  document.getElementById('view').innerHTML=content;

  if(game.type!=='choice')
    document.getElementById('answer').focus();
}

function choices(w){
  return [
    w.roma,
    ...WORDS
      .filter(x=>x.roma!==w.roma)
      .sort(()=>Math.random()-.5)
      .slice(0,3)
      .map(x=>x.roma)
  ].sort(()=>Math.random()-.5);
}

function answer(value){
  if(game.answered)return;

  let w=game.items[game.index];

  let val=(
    value||
    document.getElementById('answer').value
  ).trim().toLowerCase();

  let good=val===w.roma;

  game.answered=true;

  user.total++;

  if(good){
    user.correct++;
    game.score++;
  }else{
    let ix=WORDS.indexOf(w);

    if(!user.errors.includes(ix))
      user.errors.push(ix);
  }

  save();

  let fb=document.getElementById('feedback');

  fb.className=
    'feedback '+(good?'good':'bad');

  fb.textContent=
    good
      ?'Muito bem! Você acertou. ✓'
      :`Quase! A leitura é “${w.roma}”.`;

  setTimeout(()=>{
    game.index++;
    renderQuestion();
  },1000);
}

function finishGame(){
  clearInterval(timer);

  let accuracy=Math.round(
    (game.score/(game.index||1))*100
  );

  document.getElementById('view').innerHTML=`
    <div class="learn-wrap">

      <section class="panel game-panel">

        <span class="badge">
          Sessão concluída
        </span>

        <div style="font-size:4rem;margin:15px">
          ${accuracy>=70?'🎉':'🌸'}
        </div>

        <h2 style="margin:0;font-size:2rem">
          ${accuracy>=70
            ?'Excelente trabalho!'
            :'Continue praticando!'}
        </h2>

        <p class="sub">
          Você acertou
          <b>${game.score}</b>
          de
          <b>${game.index}</b>
          itens nesta rodada.
        </p>

        <div class="ring"
          style="--progress:${accuracy};margin:24px auto">
          <b>${accuracy}%</b>
        </div>

        <button class="btn btn-primary"
          style="max-width:360px"
          onclick="showDashboard()">
          Voltar ao início
        </button>

      </section>
    </div>
  `;
}

function speak(text){
  if(!('speechSynthesis'in window))
    return;

  window.speechSynthesis.cancel();

  let u=new SpeechSynthesisUtterance(text);

  u.lang='ja-JP';
  u.rate=.72;

  window.speechSynthesis.speak(u);
}
</script>
